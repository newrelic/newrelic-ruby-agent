name: Make prerelease tag

on:
  workflow_dispatch:
  pull_request:
    types:
      - closed

jobs:
  create_prerelease_tag:
    if: ${{ ((github.event.pull_request.merged == true) && (contains(github.event.pull_request.labels.*.name, 'prerelease'))) || (github.event_name == 'workflow_dispatch') }}
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-22.04
    steps:
    - name: Install Ruby 3.4
      uses: ruby/setup-ruby@0dafeac902942906541bc140009cdbf32665b601 # tag v1.315.0
      with:
        ruby-version: 3.4

    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag v7.0.1

    - run: bundle install

    - name: Set prerelease tag env var
      run: echo "prerelease_tag=$(bundle exec rake newrelic:version:current)-pre" >> $GITHUB_ENV

    - name: Make tag
      uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # tag v3.0.1
      with:
        tag_name: ${{ env.prerelease_tag }}
        name: ${{ env.prerelease_tag }}
        target_commitish: dev
        prerelease: true
      env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
