name: PR Closed

on:
  pull_request:
    types:
      - closed

jobs:
  issue_closer:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - name: Clone the repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # tag v7.0.0
      - name: issue_closer Action
        uses: ./.github/actions/issue_closer
        with:
          token: ${{ secrets.GITHUB_TOKEN }} # permission needed to read PR comments and close issues
