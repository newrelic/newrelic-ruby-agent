name: PR Closed

on:
  pull_request:
    types:
      - closed

jobs:
  issue_closer:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - name: Clone the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag v7.0.1
      - name: issue_closer Action
        uses: ./.github/actions/issue_closer
        with:
          token: ${{ secrets.GITHUB_TOKEN }} # permission needed to read PR comments and close issues
