name: Run Perfverse
permissions:
  contents: read
on:
  workflow_dispatch:
    inputs:
      run_1:
        description: "Git tag and env vars for runs. Format: \"git_tag:ENV_VAR_1=one;ENV_VAR_2=two\"\n 1st run"
        required: true
        type: string
      run_2:
        description: "2nd run"
        required: false
        type: string
      run_3:
        description: "3rd run"
        required: false
        type: string
      run_4:
        description: "4th run"
        required: false
        type: string
      agent_test_agent_disabled:
        description: "Test run with agent disabled?"
        default: true
        required: true
        type: boolean
      run_time:
        description: "Run time"
        default: 5m
        required: true
        type: string
      iterations:
        description: "Number of iterations to run"
        default: 5
        required: true
        type: string
      # maybe add a name for each run so its better on graph



jobs:
  prep:
    runs-on: ubuntu-latest
    outputs:
      iterations_json: ${{ steps.build.outputs.iterations_json }}
      tags_json: ${{ steps.build.outputs.tags_json }}
    steps:
      - name: Build matrix inputs
        id: build
        run: |
          iterations_json=$(jq -nc --argjson n "${{ inputs.iterations }}" '[range($n)]')
          echo "iterations_json=$iterations_json" >> "$GITHUB_OUTPUT"

          tags_json=$(jq -nc \
            --arg r1 "${{ inputs.run_1 }}" \
            --arg r2 "${{ inputs.run_2 }}" \
            --arg r3 "${{ inputs.run_3 }}" \
            --arg r4 "${{ inputs.run_4 }}" \
            --argjson disabled ${{ inputs.agent_test_agent_disabled }} \
            '[$r1, $r2, $r3, $r4] | map(select(. != ""))
             + (if $disabled then ["AGENT_DISABLED:NEW_RELIC_AGENT_ENABLED=false"] else [] end)')
          echo "tags_json=$tags_json" >> "$GITHUB_OUTPUT"

  run_perf_tests:
    needs: prep
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        iteration: ${{ fromJSON(needs.prep.outputs.iterations_json) }}
    steps:
      - name: Configure git
        run: 'git config --global init.defaultBranch main'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag v7.0.1

      - name: run all tags for this iteration
        uses: ./.github/actions/run_perfverse
        with:
          agent_tags: ${{ needs.prep.outputs.tags_json }}
          iteration_index: ${{ matrix.iteration }}
          run_time: ${{ inputs.run_time }}
          nr_license_key: ${{ secrets.NEW_RELIC_LICENSE_KEY }}

  create_graphs:
    needs: [run_perf_tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Configure git
        run: 'git config --global init.defaultBranch main'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag v7.0.1

      - name: create dirs
        run: |
          mkdir output
          mkdir inputs
        working-directory: ./test/perfverse/reports

      - name: Download all workflow run artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # tag v8.0.1
        with:
          path: test/perfverse/reports/inputs

      - name: Build docker image to make graphs
        run: |
          docker build --pull --progress=plain -t charty:local .
        working-directory: ./test/perfverse/reports

      - name: Run docker image to make graphs
        run: |
          docker run --rm --name ruby-charty --mount type=bind,source=./output,target=/charty/output charty:local
        working-directory: ./test/perfverse/reports

      - name: Upload graphs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # tag v7.0.1
        with:
          if-no-files-found: error
          path: test/perfverse/reports/output/
          name: graphs
          retention-days: 14
