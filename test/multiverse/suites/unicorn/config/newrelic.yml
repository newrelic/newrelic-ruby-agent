---
development:
  error_collector:
    enabled: true
  apdex_t: 0.5
  monitor_mode: true
  license_key: bootstrap_newrelic_admin_license_key_000
  ca_bundle_path: ../../../config/test.cert.crt
  app_name: test
  host: localhost
  port: <%= $collector && $collector.port %>
  transaction_tracer:
    record_sql: obfuscated
    enabled: true
    stack_trace_threshold: 0.5
    transaction_threshold: 1.0
  utilization:
    detect_aws: false
    detect_azure: false
    detect_docker: false
    detect_gcp: false
    detect_kubernetes: false
    detect_pcf: false
  capture_params: false
